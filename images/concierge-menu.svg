<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="leaf" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff3d3"/><stop offset="1" stop-color="#d4b16c"/>
    </linearGradient>
    <linearGradient id="cover" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#754b35"/><stop offset="1" stop-color="#37241e"/>
    </linearGradient>
  </defs>
  <ellipse cx="46" cy="85" rx="25" ry="4" fill="#0d100e" opacity=".4"/>
  <!-- The two open leaves echo the folded F/M monogram. -->
  <g stroke="#2a2019" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 73l-2 8m23-9 2 9"/>
    <path d="M34 80q-9-4-13 5 5 2 13 0zm23 0q8-5 14 3-4 3-13 3z" fill="#e8cea1"/>
    <path d="M17 51Q7 47 8 59q1 5 5 3l5-6" fill="#f6daad"/>
    <g class="wave"><path d="M74 51q7-1 9-10-5-3-3-6 1-2 4 1 1-8 4-7 2 0 1 6 5-4 6-1 0 4-5 9-2 12-13 15" fill="#f6daad"/></g>
    <path d="M13 24q17-4 32 5 15-10 33-8v47q-17 2-32 11-16-9-31-9z" fill="url(#cover)" stroke="#c9a46b"/>
    <path d="M17 19q15-1 28 8 15-11 29-11l1 47q-14 2-29 12-14-9-28-10z" fill="url(#leaf)"/>
    <path d="M45 28l1 46" stroke="#af8958" stroke-width="1.7"/>
    <path d="M23 37q4-5 9-2m22-2q5-4 10-1" stroke-width="2.4"/>
    <g class="eyes" fill="#30251c" stroke="none">
      <ellipse cx="30" cy="43" rx="3.2" ry="4.4"/><ellipse cx="59" cy="40" rx="3.2" ry="4.4"/>
      <g fill="white"><circle cx="31" cy="41.8" r="1"/><circle cx="60" cy="38.8" r="1"/></g>
    </g>
    <path d="M37 49q8 5 15-2-2 14-11 10-4-2-4-8z" fill="#63382e" stroke-width="1.8"/>
    <path d="M29 68l12 2 7-7 1 11-9-1-9 5z" fill="#466253" stroke-width="1.6"/>
    <path d="M40 69l4-1 1 5-4 1z" fill="#ecca87" stroke-width="1"/>
  </g>
  <g fill="#b77864" opacity=".6"><ellipse cx="24" cy="49" rx="4" ry="2"/><ellipse cx="66" cy="45" rx="4" ry="2"/></g>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wave { transform-origin: 77px 53px; animation: hello 2.2s ease-in-out 2; }
      .eyes { transform-origin: center; transform-box: fill-box; animation: blink 4s linear infinite; }
    }
    @keyframes hello { 15%,45% { transform: rotate(-10deg); } 30%,60% { transform: rotate(5deg); } }
    @keyframes blink { 0%,90%,96%,100% { transform: scaleY(1); } 93% { transform: scaleY(.12); } }
  </style>
</svg>
